{{- if .Values.username }}
{{/* The tenant identity, with BOTH credentials declared in one CR.

     This is the layout keycloak-config-kog's rd-user.yaml is built for — a fixed
     two-credential order, [0] password and [1] OTP — and declaring both together is not
     cosmetic. A Keycloak PUT /users/{id} with `credentials:[...]` REPLACES the entire
     credential array, so any component that enrols OTP separately WIPES the password.
     That is exactly what happened when an imperative bootstrap Job owned the OTP while
     this CR owned the password: the Job won, and the password Secret this chart wrote
     became a lie that failed every login.

     Declaring both here makes the CR the single owner of the user's credentials.

     Neither secret value is written into the CR: valueSecretRef / secretDataSecretRef
     make the controller substitute them at request time, so plaintext never lands on the
     resource. */}}
apiVersion: keycloak.ogen.krateo.io/v1alpha1
kind: KeycloakUserConfiguration
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
spec:
  authentication:
    bearer:
      tokenRef:
        name: {{ .Values.adminTokenSecret.name | quote }}
        namespace: {{ .Release.Namespace }}
        key: {{ .Values.adminTokenSecret.key | quote }}
---
apiVersion: keycloak.ogen.krateo.io/v1
kind: KeycloakUser
metadata:
  name: {{ .Values.username | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  configurationRef:
    name: keycloak-admin
    namespace: {{ .Release.Namespace }}
  realm: {{ .Values.realm | quote }}
  username: {{ .Values.username | quote }}
  enabled: {{ .Values.enabled }}
  emailVerified: {{ .Values.emailVerified }}
  {{/* Explicitly empty: a pending CONFIGURE_TOTP or UPDATE_PASSWORD required action
       blocks direct login and breaks the zero-click SSO path. */}}
  requiredActions: []
  credentials:
    - type: password
      valueSecretRef:
        name: {{ .Values.passwordSecret.name | quote }}
        key: {{ .Values.passwordSecret.key | quote }}
      temporary: false
    {{- if .Values.otpSecret.name }}
    - type: otp
      userLabel: {{ .Values.otpSecret.userLabel | quote }}
      {{/* secretData is a JSON document ({"value":"<seed>"}), not the bare seed — so the
           referenced Secret key must hold that JSON, not the raw TOTP secret. */}}
      secretDataSecretRef:
        name: {{ .Values.otpSecret.name | quote }}
        key: {{ .Values.otpSecret.key | quote }}
      credentialData: {{ .Values.otpSecret.credentialData | quote }}
    {{- end }}
{{- end }}
