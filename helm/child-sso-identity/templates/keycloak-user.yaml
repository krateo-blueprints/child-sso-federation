{{- if and .Values.username .Values.passwordSecret.name }}
apiVersion: keycloak.ogen.krateo.io/v1alpha1
kind: KeycloakUserConfiguration
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
spec:
  authentication:
    bearer:
      tokenRef:
        name: {{ .Values.adminTokenSecret.name | quote }}
        namespace: {{ .Release.Namespace }}
        key: {{ .Values.adminTokenSecret.key | quote }}
---
apiVersion: keycloak.ogen.krateo.io/v1
kind: KeycloakUser
metadata:
  name: {{ .Values.username | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  configurationRef:
    name: keycloak-admin
    namespace: {{ .Release.Namespace }}
  realm: {{ .Values.realm | quote }}
  username: {{ .Values.username | quote }}
  enabled: {{ .Values.enabled }}
  emailVerified: {{ .Values.emailVerified }}
  credentials:
    - type: password
      # Not `value:` — resolved from the Secret by the controller at request time.
      valueSecretRef:
        name: {{ .Values.passwordSecret.name | quote }}
        key: {{ .Values.passwordSecret.key | quote }}
      # Permanent: a temporary credential forces a reset screen on first login, which
      # breaks the zero-click SSO path this stack exists to demonstrate.
      temporary: false
{{- end }}
