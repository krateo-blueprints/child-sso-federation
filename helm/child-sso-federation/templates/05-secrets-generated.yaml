# W2 — the generated secret pair (lookup-preserve). randAlphaNum on FIRST render;
# re-emitted from the live Secret on every re-render -> byte-stable, never rotates.
# The SAME values are injected (at chart-render time) into BOTH the keystone
# KeycloakClient CR (realm-apply Job) AND the Openstack vhost (openstack-instantiate
# Job). These Secrets are the durable source of truth for that stability.
apiVersion: v1
kind: Secret
metadata:
  name: keystone-oidc-client
  namespace: {{ include "child-sso.namespace" . }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
type: Opaque
data:
  KEYSTONE_CLIENT_SECRET: {{ include "child-sso.keystoneClientSecret" . | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keystone-oidc-crypto
  namespace: {{ include "child-sso.namespace" . }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
type: Opaque
data:
  OIDC_CRYPTO_PASSPHRASE: {{ include "child-sso.oidcCryptoPassphrase" . | b64enc | quote }}
