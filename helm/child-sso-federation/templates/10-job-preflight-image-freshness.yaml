{{- if .Values.preflight.enabled }}
{{- $ns := include "child-sso.namespace" . }}
{{- $sa := "csso-preflight" }}
# W1 — preflight-image-freshness (child-stale-image-cache handling):
# flip child core-provider/oasgen/rdc to imagePullPolicy: Always + rollout restart
# + log the running digest, THEN — only once the fresh controllers have generated
# the Composition CRDs — instantiate the operator Composition CRs (Keycloak + the
# two KOGs). Never trust CRDs generated by a stale image.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["composition.krateo.io"]
    resources: ["keycloaks", "keycloakconfigkogs", "openstackkeystoneoperatorkogs"]
    verbs: ["get", "create", "patch", "update"]
  # clear the Crossplane external-create-pending guard on the federation CDs.
  - apiGroups: ["core.krateo.io"]
    resources: ["compositiondefinitions"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
# NB: cluster-scoped CRD read (for the `kubectl get crd` wait-loops) is granted to
# EVERY csso Job SA by templates/01-rbac-crd-reader.yaml (shared ClusterRole).
---
{{- $keycloakCR := printf `apiVersion: %s
kind: Keycloak
metadata:
  name: keycloak
  namespace: %s
spec:
  keycloak:
    name: keycloak
    instances: 1
    hostname: "https://%s"
    http:
      httpEnabled: true
      tlsSecretName: ""
    ingress:
      enabled: false
    proxyHeaders: "xforwarded"
    additionalOptions:
      - name: hostname-strict
        value: "false"
  db:
    vendor: postgres
    database: keycloak
    provider: cloudnativepg
    cloudnativepg:
      clusterName: keycloak-db
      instances: 1
      owner: keycloak
      storage:
        size: 2Gi
  bootstrapAdmin:
    enabled: true
    secret:
      create: false
      name: keycloak-initial-admin
` .Values.compositionApiVersions.keycloak $ns (include "child-sso.host.keycloak" .) }}
{{- $configKogCR := printf `apiVersion: %s
kind: KeycloakConfigKog
metadata:
  name: keycloak-config-kog
  namespace: %s
spec:
  keycloak:
    baseUrl: "%s"
  auth:
    secretName: keycloak-admin-token
    secretKey: token
    externalSecret:
      enabled: true
      refreshInterval: "60s"
      tokenEndpoint: "%s/realms/master/protocol/openid-connect/token"
      clientId: "krateo-kog"
` .Values.compositionApiVersions.keycloakConfigKog $ns .Values.inCluster.keycloakBaseUrl .Values.inCluster.keycloakBaseUrl }}
{{- $keystoneKogCR := printf `apiVersion: %s
kind: OpenstackKeystoneOperatorKog
metadata:
  name: openstack-keystone-kog
  namespace: %s
spec:
  authBridge:
    enabled: true
    cloudsSecret: keystone-clouds
    upstreamEndpoint: "%s"
  restdefinitions:
    project:
      enabled: true
    user:
      enabled: true
    role:
      enabled: true
    role_assignment:
      enabled: true
    domain:
      enabled: true
` .Values.compositionApiVersions.keystoneKog $ns .Values.inCluster.keystoneAuthUrl }}
{{- $script := printf `set -eu
NS="%[1]s"
CORE_DEPLOY="%[2]s"
CORE_IMAGE="%[3]s"
echo "[preflight] PINNING $CORE_DEPLOY to the fresh core-provider image $CORE_IMAGE"
if kubectl -n "$NS" get deploy "$CORE_DEPLOY" >/dev/null 2>&1; then
  # 1) pin the exact fresh image (installer pins a stale 2.8.4 -> lossy crdgen).
  kubectl -n "$NS" set image "deploy/$CORE_DEPLOY" "*=$CORE_IMAGE" || true
  # 2) force a fresh pull of that tag + roll.
  kubectl -n "$NS" patch deploy "$CORE_DEPLOY" --type=json \
    -p "[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/imagePullPolicy\",\"value\":\"Always\"}]" 2>/dev/null || true
  kubectl -n "$NS" patch deploy "$CORE_DEPLOY" --type=merge \
    -p '{"spec":{"template":{"metadata":{"annotations":{"krateo.io/restartedAt":"'"$(date +%%s)"'"}}}}}' || true
  kubectl -n "$NS" rollout status "deploy/$CORE_DEPLOY" --timeout=300s || true
  RUNNING=$(kubectl -n "$NS" get deploy "$CORE_DEPLOY" -o jsonpath='{.spec.template.spec.containers[0].image}')
  echo "[preflight] $CORE_DEPLOY now running image: $RUNNING"
  case "$RUNNING" in
    *"$CORE_IMAGE"*|"$CORE_IMAGE") echo "[preflight] image assert OK" ;;
    *) echo "[preflight] WARN running image ($RUNNING) != expected ($CORE_IMAGE)" >&2 ;;
  esac
else
  echo "[preflight] WARN deploy $CORE_DEPLOY not found (adjust preflight.deployments)"
fi
echo "[preflight] clearing Crossplane external-create-pending guard on federation CDs"
for cd in %[4]s; do
  if kubectl -n "$NS" get compositiondefinition "$cd" >/dev/null 2>&1; then
    kubectl -n "$NS" annotate compositiondefinition "$cd" krateo.io/external-create-pending- >/dev/null 2>&1 || true
    echo "[preflight] cleared external-create-pending on $cd"
  else
    echo "[preflight] CD $cd not present (skipping annotation clear)"
  fi
done
echo "[preflight] waiting for Composition CRDs generated by the fresh controllers"
for crd in keycloaks.composition.krateo.io keycloakconfigkogs.composition.krateo.io openstackkeystoneoperatorkogs.composition.krateo.io; do
  until kubectl get crd "$crd" >/dev/null 2>&1; do echo "[preflight] waiting for $crd"; sleep 5; done
done
echo "[preflight] instantiating operator Composition CRs (server-side apply, idempotent)"
kubectl apply --server-side --force-conflicts -f /manifests/keycloak.yaml
kubectl apply --server-side --force-conflicts -f /manifests/config-kog.yaml
kubectl apply --server-side --force-conflicts -f /manifests/keystone-kog.yaml
echo "[preflight] done"
` $ns (index .Values.preflight.deployments 0) .Values.preflight.coreProviderImage (join " " .Values.preflight.clearPendingCompositionDefinitions) }}
{{- $cmData := dict "keycloak.yaml" $keycloakCR "config-kog.yaml" $configKogCR "keystone-kog.yaml" $keystoneKogCR "run.sh" $script }}
{{- $suffix := ($cmData | toYaml | sha256sum | trunc 8) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: csso-preflight
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
data:
{{- range $k, $v := $cmData }}
  {{ $k }}: |-
{{ $v | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: csso-preflight-{{ $suffix }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: child-sso-federation
    spec:
      serviceAccountName: {{ $sa }}
      restartPolicy: Never
      initContainers:
        {{- include "child-sso.waitloop" (dict "cmd" (printf "kubectl -n %s get deploy %s" $ns (index .Values.preflight.deployments 0)) "msg" "child controllers present" "root" .) | nindent 8 }}
      containers:
        - name: main
          image: {{ .Values.images.tools | quote }}
          imagePullPolicy: {{ .Values.images.toolsPullPolicy }}
          command: ["/bin/sh", "/manifests/run.sh"]
          volumeMounts:
            - name: manifests
              mountPath: /manifests
      volumes:
        - name: manifests
          configMap:
            name: csso-preflight
{{- end }}
