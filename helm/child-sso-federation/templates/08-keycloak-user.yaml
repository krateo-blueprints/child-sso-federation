{{- if .Values.demoUser }}
{{- $ns := include "child-sso.namespace" . }}
{{- $user := .Values.demoUser }}
{{- $secretName := printf "%s-password" $user }}
{{/* 08 — the tenant's login identity.

     This REPLACES the token bridge. Keystone cannot consume a Krateo authn JWT, so the
     old design ran 236 lines of hand-rolled auth in a tenant-reachable pod to translate
     one into a Keystone token. Making the identity a KeycloakUser removes the translation
     entirely: the user authenticates at Keycloak and the OIDC federation this chart
     already configures carries them into Keystone and Horizon. Keystone autoprovisions
     the project and `member` role from the federation mapping on first login.

     THE CR IS NOT RENDERED HERE — deliberately. Its CRD is created by keycloak-config-kog
     several async hops away (CompositionDefinition -> composition -> oasgen
     RestDefinitions -> RDC -> CRD), and Helm validates every manifest before applying any,
     so a CR in this release fails the ENTIRE install with "no matches for kind
     KeycloakUser ... ensure CRDs are installed first". Guarding it with `lookup` made the
     install succeed but never delivered the CR: vcluster init-helm renders once (observed
     live: the release reached revision v2, still before the CRD existed) and never again.

     So the identity ships as its own COMPOSITION (child-sso-identity). The
     composition-dynamic-controller re-renders on every reconcile, so it retries until the
     CRD exists and then converges — the same mechanism the openstack umbrella uses to add
     components as their dependencies become Ready.

     What stays here is the password Secret, because it is a core kind with no ordering
     problem and it must exist before the composition references it. It is
     lookup-preserved, matching 07-basic-user: reuse the live value if present, otherwise
     demoUserPassword or a generated one — byte-stable across re-renders, so a reconcile
     never silently rotates a working credential. */}}
{{- $existing := (lookup "v1" "Secret" $ns $secretName) }}
{{- $pw := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{-   $pw = index $existing.data "password" | b64dec }}
{{- else }}
{{-   $pw = .Values.demoUserPassword | default (randAlphaNum 20) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  password: {{ $pw | quote }}
---
{{/* The composition that actually creates the KeycloakUser. Its CRD comes from the
     child-sso-identity CompositionDefinition registered in 00-compositiondefinitions.yaml;
     core-provider derives the served version from that chart's version, which is why
     compositionApiVersions.identity is pinned alongside charts.identity.version. */}}
apiVersion: {{ .Values.compositionApiVersions.identity }}
kind: ChildSsoIdentity
metadata:
  name: {{ $user }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
spec:
  realm: {{ .Values.realm | quote }}
  username: {{ $user | quote }}
  enabled: true
  emailVerified: true
  passwordSecret:
    name: {{ $secretName | quote }}
    key: password
  adminTokenSecret:
    name: keycloak-admin-token
    key: token
{{- end }}
