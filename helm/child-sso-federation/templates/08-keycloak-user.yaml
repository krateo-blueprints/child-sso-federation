{{/* 08 — the tenant's login identity.

     Both the identity AND its credentials are owned by the KeycloakUser CR that
     child-sso-identity ships (a later init-helm entry). Its password and OTP both come
     from Secret `mfa-demo-cred` and are written in ONE request — Keycloak replaces the
     whole credential array on write, so a second writer wipes the first.

     This template used to emit a `<demoUser>-password` Secret for the CR to reference.
     It is gone: csso-mfa-bootstrap reset the password from mfa-demo-cred/KC_PASS
     afterwards, so that Secret never matched what Keycloak actually held — it failed
     every login while looking authoritative. One credential, one source, one owner. */}}
