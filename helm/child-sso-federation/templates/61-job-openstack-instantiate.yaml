{{- $ns := include "child-sso.namespace" . }}
{{- $sa := "csso-openstack-instantiate" }}
{{- $keycloak := include "child-sso.host.keycloak" . }}
{{- $keystone := include "child-sso.host.keystone" . }}
{{- $horizon := include "child-sso.host.horizon" . }}
{{- $ksSecret := include "child-sso.keystoneClientSecret" . }}
{{- $crypto := include "child-sso.oidcCryptoPassphrase" . }}
{{- $cr := .Files.Get "files/openstack-cr.yaml" }}
{{- $cr = $cr | replace "__APIVERSION__" .Values.compositionApiVersions.openstack }}
{{- $cr = $cr | replace "__NAMESPACE__" $ns }}
{{- $cr = $cr | replace "__PROFILE__" .Values.openstack.profile }}
{{- $cr = $cr | replace "__KEYSTONE_IMAGE__" .Values.keystoneImage }}
{{- $cr = $cr | replace "__REALM__" .Values.realm }}
{{- $cr = $cr | replace "__KEYCLOAK_HOST__" $keycloak }}
{{- $cr = $cr | replace "__KEYSTONE_HOST__" $keystone }}
{{- $cr = $cr | replace "__HORIZON_HOST__" $horizon }}
{{- $cr = $cr | replace "__KEYSTONE_CLIENT_SECRET__" $ksSecret }}
{{- $cr = $cr | replace "__OIDC_CRYPTO_PASSPHRASE__" $crypto }}
# W5 — openstack-instantiate: apply the Openstack CR with the FINAL federation
# componentValues. GET-before-create -> applied ONCE, NEVER re-patched (this is
# what dodges the fernet churn + umbrella Horizon-prune deadlock). The generated
# secret pair is injected at chart-render time (byte-stable across re-renders).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
rules:
  - apiGroups: ["composition.krateo.io"]
    resources: ["openstacks"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
---
{{- $script := printf `set -eu
NS="%s"
if kubectl -n "$NS" get openstack openstack >/dev/null 2>&1; then
  echo "[openstack-instantiate] Openstack CR already exists — leaving it UNTOUCHED (fernet-safe, never re-patch)"
  exit 0
fi
echo "[openstack-instantiate] creating Openstack CR with FINAL federation componentValues (once)"
kubectl apply -f /manifests/openstack.yaml
echo "[openstack-instantiate] done"
` $ns }}
{{- $suffix := (printf "%s%s" $cr $script | sha256sum | trunc 8) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
data:
  openstack.yaml: |-
{{ $cr | indent 4 }}
  run.sh: |-
{{ $script | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $sa }}-{{ $suffix }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: child-sso-federation
    spec:
      serviceAccountName: {{ $sa }}
      restartPolicy: Never
      initContainers:
        {{- include "child-sso.waitloop" (dict "cmd" "kubectl get crd openstacks.composition.krateo.io >/dev/null 2>&1" "msg" "Openstack composition CRD present" "root" .) | nindent 8 }}
      containers:
        - name: main
          image: {{ .Values.images.tools | quote }}
          imagePullPolicy: {{ .Values.images.toolsPullPolicy }}
          command: ["/bin/sh", "/scripts/run.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: manifests
              mountPath: /manifests
      volumes:
        - name: scripts
          configMap:
            name: {{ $sa }}
            items:
              - key: run.sh
                path: run.sh
        - name: manifests
          configMap:
            name: {{ $sa }}
            items:
              - key: openstack.yaml
                path: openstack.yaml
