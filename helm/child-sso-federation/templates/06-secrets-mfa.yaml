{{- if .Values.mfa.enabled }}
# W2 (MFA) — the step-up demo user's credentials (lookup-preserve). randAlphaNum on
# FIRST render; re-emitted from the live Secret on every re-render -> byte-stable so
# the MFA bootstrap Job resets the SAME password + re-enrols the SAME TOTP secret
# each run (idempotent, never rotates). Consumed by the csso-mfa-bootstrap Job only.
apiVersion: v1
kind: Secret
metadata:
  name: mfa-demo-cred
  namespace: {{ include "child-sso.namespace" . }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
type: Opaque
data:
  KC_PASS: {{ include "child-sso.mfaPassword" . | b64enc | quote }}
  TOTP_SECRET: {{ include "child-sso.mfaTotpSecret" . | b64enc | quote }}
  {{/* The same seed wrapped as the JSON document Keycloak stores in
       credentials[].secretData. The KeycloakUser CR references THIS key via
       secretDataSecretRef; the bare seed there would be rejected. */}}
  TOTP_SECRET_DATA: {{ printf "{\"value\":\"%s\"}" (include "child-sso.mfaTotpSecret" .) | b64enc | quote }}
{{- end }}
