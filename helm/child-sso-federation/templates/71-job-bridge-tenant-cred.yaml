{{- if .Values.demoUser }}
{{- $ns := include "child-sso.namespace" . }}
{{- $sa := "csso-bridge-tenant-cred" }}
{{- $ks := .Values.inCluster.keystoneAuthUrl }}
{{- $domain := .Values.openstack.domain }}
{{- $project := .Values.openstack.demoProject }}
{{- $adminSecret := .Values.keystone.adminSecret }}
{{- $k := .Values.keystone.keys }}
{{- $portalUser := .Values.demoUser }}
{{- $ksUser := printf "%s-basic" .Values.demoUser }}
{{- $credSecret := printf "sso-bridge-%s" .Values.demoUser }}
# W6 — bridge-tenant-cred: idempotent PASSWORD-grant Keystone user for the
# basic-auth token-bridge (app-cred auth is disabled). Creates <demoUser>-basic,
# grants member on the demo project, writes sso-bridge-<demoUser> {user_id,
# password, project_id} keyed by the portal username the bridge sees in the JWT.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
---
{{- $script := printf `set -eu
NS="%[1]s"
KS="%[2]s"
DOMAIN="%[3]s"
PROJECT="%[4]s"
ADMIN_SECRET="%[5]s"
KS_USER="%[11]s"
CRED_SECRET="%[12]s"
FILE_KEY="%[13]s.json"
if kubectl -n "$NS" get secret "$CRED_SECRET" >/dev/null 2>&1; then
  echo "[bridge-tenant-cred] $CRED_SECRET already exists — leaving credential untouched (idempotent)"
  exit 0
fi
get() { kubectl -n "$NS" get secret "$ADMIN_SECRET" -o jsonpath="{.data.$1}" 2>/dev/null | base64 -d || true; }
OS_USER=$(get %[6]s); OS_USER=${OS_USER:-admin}
OS_PASS=$(get %[7]s)
OS_PROJ=$(get %[8]s); OS_PROJ=${OS_PROJ:-admin}
OS_UDOM=$(get %[9]s); OS_UDOM=${OS_UDOM:-Default}
OS_PDOM=$(get %[10]s); OS_PDOM=${OS_PDOM:-Default}
[ -n "$OS_PASS" ] || { echo "no admin password in $ADMIN_SECRET" >&2; exit 1; }
REQ='{"auth":{"identity":{"methods":["password"],"password":{"user":{"name":"'"$OS_USER"'","domain":{"name":"'"$OS_UDOM"'"},"password":"'"$OS_PASS"'"}}},"scope":{"project":{"name":"'"$OS_PROJ"'","domain":{"name":"'"$OS_PDOM"'"}}}}}'
TOKEN=$(curl -fsS -D - -o /dev/null -X POST "$KS/auth/tokens" -H 'Content-Type: application/json' -d "$REQ" | tr -d '\r' | awk 'tolower($1)=="x-subject-token:"{print $2}')
[ -n "$TOKEN" ] || { echo "no admin token" >&2; exit 1; }
AUTH="X-Auth-Token: $TOKEN"
DID=$(curl -fsS -H "$AUTH" "$KS/domains?name=$DOMAIN" | jq -r '.domains[0].id // empty')
[ -n "$DID" ] || { echo "domain $DOMAIN not found (run keystone-federation first)" >&2; exit 1; }
PID=$(curl -fsS -H "$AUTH" "$KS/projects?name=$PROJECT&domain_id=$DID" | jq -r '.projects[0].id // empty')
[ -n "$PID" ] || { echo "project $PROJECT not found" >&2; exit 1; }
RID=$(curl -fsS -H "$AUTH" "$KS/roles?name=member" | jq -r '.roles[0].id // empty')
[ -n "$RID" ] || { echo "role member not found" >&2; exit 1; }
NEWPASS=$(tr -dc a-f0-9 </dev/urandom | head -c 40)
# 0.1.6: scope the user lookup by domain_id. Without it the admin token doesn't see the
# user in the keycloak domain -> GET returns empty -> the create POST 409s on re-run
# ("user create failed"). (Same create-only-409 idempotency class as mapping/flow.)
UID=$(curl -fsS -H "$AUTH" "$KS/users?name=$KS_USER&domain_id=$DID" | jq -r '.users[0].id // empty')
if [ -z "$UID" ]; then
  UID=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -X POST "$KS/users" -d '{"user":{"name":"'"$KS_USER"'","domain_id":"'"$DID"'","password":"'"$NEWPASS"'","enabled":true}}' | jq -r .user.id)
else
  curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -X PATCH "$KS/users/$UID" -d '{"user":{"password":"'"$NEWPASS"'"}}' >/dev/null
fi
[ -n "$UID" ] || { echo "user create failed" >&2; exit 1; }
curl -fsS -H "$AUTH" -X PUT "$KS/projects/$PID/users/$UID/roles/$RID" >/dev/null
echo "[bridge-tenant-cred] user=$KS_USER uid=$UID project=$PID pass_len=${#NEWPASS}"
printf '{"user_id":"%%s","password":"%%s","project_id":"%%s"}' "$UID" "$NEWPASS" "$PID" > /tmp/cred.json
kubectl -n "$NS" create secret generic "$CRED_SECRET" --from-file="$FILE_KEY"=/tmp/cred.json --dry-run=client -o yaml | kubectl apply -f -
echo "[bridge-tenant-cred] wrote $CRED_SECRET (key $FILE_KEY)"
` $ns $ks $domain $project $adminSecret $k.username $k.password $k.projectName $k.userDomainName $k.projectDomainName $ksUser $credSecret $portalUser }}
{{- $suffix := ($script | sha256sum | trunc 8) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
data:
  run.sh: |-
{{ $script | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $sa }}-{{ $suffix }}
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: child-sso-federation
    spec:
      serviceAccountName: {{ $sa }}
      restartPolicy: Never
      initContainers:
        {{- include "child-sso.waitloop" (dict "cmd" (printf "curl -fsS -o /dev/null %s" $ks) "msg" "keystone /v3 reachable (demo project provisioned by keystone-federation)" "root" .) | nindent 8 }}
      containers:
        - name: main
          image: {{ .Values.images.tools | quote }}
          imagePullPolicy: {{ .Values.images.toolsPullPolicy }}
          command: ["/bin/sh", "/scripts/run.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: {{ $sa }}
{{- end }}
