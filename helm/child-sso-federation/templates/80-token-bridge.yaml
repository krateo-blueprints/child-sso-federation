{{- if .Values.bridge.enabled }}
{{- $ns := include "child-sso.namespace" . }}
{{- $credSecret := printf "sso-bridge-%s" (.Values.demoUser | default "tenant") }}
# W7 — token-bridge (basic-auth Krateo identity -> Horizon WebSSO). Verbatim
# proven script from the ConfigMap. Verifies the caller's Krateo authn JWT LOCALLY
# (HS256, shared jwt-sign-key). PASSWORD grant (app-cred auth is disabled).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-sso-bridge-app
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
data:
  app.py: |-
{{ .Files.Get "files/openstack-sso-bridge.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstack-sso-bridge
  namespace: {{ $ns }}
  labels:
    app: openstack-sso-bridge
    {{- include "child-sso.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openstack-sso-bridge
  template:
    metadata:
      labels:
        app: openstack-sso-bridge
        # host-side D28 alias Service selects on this label (post vcluster-sync).
        app.kubernetes.io/name: openstack-sso-bridge
    spec:
      containers:
        - name: bridge
          image: {{ .Values.images.bridge | quote }}
          command: ["python3", "/app/app.py"]
          envFrom:
            # provides JWT_SIGN_KEY (shared HS256 secret). READ-ONLY reuse.
            - secretRef:
                name: {{ .Values.bridge.jwtSignKeySecret | quote }}
          env:
            - name: JWT_ISSUER
              value: {{ .Values.bridge.jwtIssuer | quote }}
            {{- if .Values.bridge.authCookieName }}
            - name: AUTH_COOKIE_NAME
              value: {{ .Values.bridge.authCookieName | quote }}
            {{- end }}
            - name: KEYSTONE_AUTH_URL
              value: {{ .Values.inCluster.keystoneAuthUrl | quote }}
            - name: HORIZON_WEBSSO_URL
              value: {{ printf "https://%s/auth/websso/" (include "child-sso.host.horizon" .) | quote }}
            - name: TENANT_CRED_DIR
              value: "/etc/sso-bridge/tenants"
            - name: LISTEN_PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: app
              mountPath: /app
            - name: tenants
              mountPath: /etc/sso-bridge/tenants
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: app
          configMap:
            name: openstack-sso-bridge-app
        - name: tenants
          projected:
            sources:
              # per-tenant Keystone creds written by the bridge-tenant-cred Job.
              # optional=true so the bridge still starts before creds land.
              - secret:
                  name: {{ $credSecret | quote }}
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: openstack-sso-bridge
  namespace: {{ $ns }}
  labels:
    app: openstack-sso-bridge
    {{- include "child-sso.labels" . | nindent 4 }}
spec:
  selector:
    app: openstack-sso-bridge
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
