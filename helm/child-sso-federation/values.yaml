# =============================================================================
# child-sso-federation — per-tenant values. NOTHING here hardcodes braghettos.
# The wrapper (selfservice-krateo) builds these from the self-service request:
#   baseHost = <instanceName>.<ingress.domain>
# and all hosts/issuer derive from baseHost unless explicitly overridden.
# =============================================================================

# The child external base host: "<instanceName>.<domain>", e.g. acme.krateo.dev.
# REQUIRED. Every external host + the OIDC issuer derive from it.
baseHost: ""

# Namespace everything is created in (inside the child vcluster).
namespace: krateo-system

# Keycloak realm used for federation.
realm: krateo

# The OIDC issuer. Leave empty to derive: https://keycloak.<baseHost>/realms/<realm>
# It MUST be byte-identical across the browser, child authn, and the Keystone RP.
issuer: ""

# External hosts. Leave empty to derive from baseHost (recommended).
hosts:
  keycloak: ""    # keycloak.<baseHost>   — the ISSUER host (full-URL hostname on the Keycloak CR)
  keystone: ""    # keystone.<baseHost>   — mod_auth_openidc RP + WebSSO callback
  horizon: ""     # horizon.<baseHost>    — trusted_dashboard
  portal: ""      # <baseHost>            — child Krateo portal (authn redirect root)
  ssoBridge: ""   # sso-bridge.<baseHost> — basic-auth token-bridge

# The mod_auth_openidc-enabled Keystone image (baked at CR creation).
keystoneImage: "ghcr.io/braghettos/keystone-oidc:2025.1-ubuntu_jammy"

# The portal (basic-auth) username the token-bridge maps to the demo tenant.
# Its Keystone user + sso-bridge-<demoUser>.json cred file are provisioned by the
# bridge-tenant-cred Job. Leave empty to skip bridge tenant-cred provisioning.
# A matching krateo-auth-basic User is created (07-basic-user.yaml) so the child-portal
# login identity == the bridge tenant mapping.
demoUser: ""

# Password for the demoUser's krateo-auth-basic login. Empty -> a stable random one is
# generated and lookup-preserved in Secret <demoUser>-password (read it from there for
# programmatic login). Set it only if you need a known password.
demoUserPassword: ""

openstack:
  profile: identity      # identity = MariaDB+Memcached+Keystone+Glance+Horizon
  domain: keycloak       # federation domain (NB: "federated" is reserved by Keystone)
  demoProject: demo      # JIT auto-provisioned project

# Keystone admin credentials (OSH-created RC secret) used to drive the Keystone
# REST API for federation setup + tenant-cred provisioning.
keystone:
  adminSecret: keystone-keystone-admin
  # keys within adminSecret (OSH openrc shape); fallbacks apply if a key is empty.
  keys:
    username: OS_USERNAME
    password: OS_PASSWORD
    projectName: OS_PROJECT_NAME
    userDomainName: OS_USER_DOMAIN_NAME
    projectDomainName: OS_PROJECT_DOMAIN_NAME
  # Fernet resilience: on a fresh install a keystone helm re-render can wipe the
  # keystone-fernet-keys Secret (credential-keys survive, fernet doesn't) -> token
  # 500s (KeysNotFound). This Job repopulates the keyset if it is EMPTY + rolls
  # keystone-api. Idempotent: a no-op when the keyset already has entries.
  fernetEnsure:
    enabled: true

# Published charts registered as CompositionDefinitions / instantiated.
charts:
  keycloak:
    url: "oci://ghcr.io/braghettos/charts/keycloak"
    version: "0.1.0"
  keycloakConfigKog:
    url: "oci://ghcr.io/braghettos/charts/keycloak-config-kog"
    version: "0.3.0"
  keystoneKog:
    url: "oci://ghcr.io/braghettos/charts/openstack-keystone-operator-kog"
    version: "0.1.0"
  openstack:
    url: "oci://ghcr.io/braghettos/charts/openstack"
    version: "0.3.2"

# apiVersions of the CRDs generated by the above CompositionDefinitions.
# core-provider derives the served version from the chart version; these defaults
# match what the proven artifacts used. OVERRIDABLE for live-verification (T1).
compositionApiVersions:
  keycloak: "composition.krateo.io/v0-1-0"
  keycloakConfigKog: "composition.krateo.io/v0-3-0"
  keystoneKog: "composition.krateo.io/v0-1-0"
  openstack: "composition.krateo.io/v0-3-2"

# In-cluster service endpoints (server-to-server; NOT the issuer). Admin/token
# calls take these fast in-cluster paths, unaffected by external TLS.
inCluster:
  keycloakBaseUrl: "http://keycloak-service.krateo-system.svc.cluster.local:8080"
  keystoneAuthUrl: "http://keystone-api.krateo-system.svc.cluster.local:5000/v3"

# Images used by the bootstrap Jobs and the token-bridge.
images:
  # kubectl + curl + jq — used by every bootstrap Job (wait-loops +
  # idempotent apply + Admin/Keystone API calls). NB: NO openssl (alpine/k8s
  # ships none) — random creds are generated from /dev/urandom.
  tools: "alpine/k8s:1.31.1"
  # the token-bridge runtime (python3 stdlib; runs the verbatim bridge script).
  bridge: "quay.io/airshipit/openstack-client:2025.1-ubuntu_jammy"
  # python3 stdlib — runs the Keycloak step-up Admin-API flow-builders (MFA).
  python: "python:3.12-alpine"
  toolsPullPolicy: IfNotPresent

# token-bridge (basic-auth -> Horizon WebSSO). Verifies the caller's Krateo authn
# JWT LOCALLY (HS256) against the shared jwt-sign-key Secret.
bridge:
  enabled: true
  jwtIssuer: "krateo.io"
  jwtSignKeySecret: "jwt-sign-key"   # existing shared HS256 secret (READ-ONLY reuse)
  authCookieName: ""                 # "" = bearer-only

# child-stale-image-cache handling: the installer pins a stale core-provider
# (2.8.4 → lossy crdgen → broken composition CRDs). preflight PINS the fresh
# image, flips imagePullPolicy: Always, rolls it, asserts the running image, and
# clears the Crossplane external-create-pending guard on the federation CDs BEFORE
# any operator Composition CR is applied. Only installer-core-provider exists in
# the child (the oasgen/rdc installer deploys do NOT) — do not add them back.
preflight:
  enabled: true
  # The fresh core-provider the child MUST run before we trust generated CRDs.
  coreProviderImage: "ghcr.io/braghettos/krateo-core-provider:2.10.0"
  deployments:
    - installer-core-provider
  # CompositionDefinitions whose Crossplane external-create-pending annotation the
  # preflight Job clears (they get stuck Synced=False otherwise). Cleared best-effort.
  clearPendingCompositionDefinitions:
    - keycloak-operator-blueprint
    - keycloak-config-kog
    - openstack-keystone-operator-kog
    - openstack

# The JWT-carrying Horizon widget (task C dependency — bearer-only until then).
widget:
  enabled: true

# -----------------------------------------------------------------------------
# Step-up MFA (Keycloak client-level browser-mfa flow + child apiserver VAP gate).
# The Keycloak step-up (realm OTP + browser-mfa flow + `kubernetes` public client
# + demo user/OTP) is bootstrapped via the Keycloak Admin API (the KOG CRDs cannot
# express it). NEVER flips the realm global browserFlow — client-level binding only,
# so keystone/krateo-authn logins are untouched. The VAP is a no-op until the child
# apiserver runs --authentication-config (shipped by selfservice-krateo 0.2.4).
# -----------------------------------------------------------------------------
mfa:
  enabled: true
  # The step-up demo user enrolled with password + TOTP in realm `krateo`.
  demoUser: braghettos
  # The Keycloak group whose members (groups claim -> oidc:<group>) may DELETE
  # Compositions after an acr=2 step-up. Bound by a NAMESPACED Role/RoleBinding.
  adminGroup: braghettos-admin

# Per-Job wait-loop timeout (seconds) before the init-container gives up.
waitTimeoutSeconds: 1800
